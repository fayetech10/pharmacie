<div class="animate-pulse space-y-4 py-4 w-full">
  <!-- Version Desktop (Tableau) -->
  <div class="hidden md:block w-full bg-white rounded-lg shadow overflow-hidden border border-gray-100">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-50 border-b border-gray-200">
          <th *ngFor="let col of colsArray" class="p-4">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rowsArray" class="border-b border-gray-100">
          <td *ngFor="let col of colsArray" class="p-4">
            <div class="h-4 bg-gray-100 rounded" [ngClass]="{'w-1/2': col % 2 === 0, 'w-3/4': col % 2 !== 0}"></div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Version Mobile (Cartes) -->
  <div class="md:hidden space-y-3">
    <div *ngFor="let row of rowsArray" class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
      <div class="flex justify-between mb-3">
        <div class="h-5 bg-gray-200 rounded w-1/2"></div>
        <div class="h-5 bg-gray-200 rounded w-1/4"></div>
      </div>
      <div class="h-4 bg-gray-100 rounded w-1/3 mb-4"></div>
      <div class="flex justify-between items-center">
        <div class="h-6 bg-gray-200 rounded w-1/3"></div>
        <div class="h-8 w-8 bg-gray-100 rounded-full"></div>
      </div>
    </div>
  </div>
</div>
