<div class="space-y-4 py-4 w-full">
  <!-- Version Desktop (Tableau) -->
  <div class="hidden md:block w-full bg-white rounded-lg overflow-hidden border border-gray-200/60">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-[#FAFBFC] border-b border-gray-200/80">
          <th *ngFor="let col of colsArray; let i = index" class="p-4">
            <div class="skeleton h-3.5 rounded"
                 [style.width.%]="55 + (col % 3) * 10"
                 [style.animation-delay.ms]="i * 40"></div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rowsArray; let r = index"
            class="border-b border-gray-100 last:border-0">
          <td *ngFor="let col of colsArray; let c = index" class="p-4">
            <div class="skeleton h-3.5 rounded"
                 [style.width.%]="40 + ((row + col) % 4) * 12"
                 [style.animation-delay.ms]="100 + r * 50 + c * 25"></div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Version Mobile (Cartes) -->
  <div class="md:hidden space-y-3">
    <div *ngFor="let row of rowsArray; let i = index"
         class="bg-white p-4 rounded-lg border border-gray-200/60">
      <div class="flex justify-between mb-3">
        <div class="skeleton h-5 rounded w-1/2"
             [style.animation-delay.ms]="i * 70"></div>
        <div class="skeleton h-5 rounded w-1/4"
             [style.animation-delay.ms]="i * 70 + 30"></div>
      </div>
      <div class="skeleton h-4 rounded w-2/5 mb-4"
           [style.animation-delay.ms]="i * 70 + 60"></div>
      <div class="flex justify-between items-center">
        <div class="skeleton h-6 rounded w-1/3"
             [style.animation-delay.ms]="i * 70 + 90"></div>
        <div class="skeleton h-8 w-8 rounded-full"
             [style.animation-delay.ms]="i * 70 + 120"></div>
      </div>
    </div>
  </div>
</div>
