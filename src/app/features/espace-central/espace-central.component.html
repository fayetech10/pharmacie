<div class="fade-in">
  <div class="page-head max-md:hidden">
    <div>
      <h1>Espace Central</h1>
      <p>Supervisez au niveau national et effectuez les paiements</p>
    </div>
  </div>

  <mat-tab-group animationDuration="0ms" [selectedIndex]="selectedTab" (selectedIndexChange)="onTabChange($event)">
    <mat-tab label="Tableau de bord">
      <ng-template matTabContent>
        <div class="pt-2 md:pt-6">
          <!-- admin-regions agit comme vue drill-down Région -> Pharmacies -->
          <app-admin-regions></app-admin-regions>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Facture Structure sanitaire">
      <ng-template matTabContent>
        <div class="pt-2 md:pt-6">
          <app-central-factures-structure></app-central-factures-structure>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Facture Pharmacie">
      <ng-template matTabContent>
        <div class="pt-2 md:pt-6">
          <app-central-factures-pharmacie></app-central-factures-pharmacie>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
