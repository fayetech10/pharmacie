<div class="fade-in">

  <div class="page-head">
    <div>
      <h1>Paramétrage</h1>
    </div>
  </div>

  <div class="card">
    <div class="section-header">
      <div class="section-title-group">
        <div class="section-icon"><mat-icon>approval</mat-icon></div>
        <div>
          <h2>Cachet et signature</h2>
        </div>
      </div>
    </div>

    <div class="section-body">
      <div *ngIf="loading" class="py-6 text-center text-text-secondary">Chargement…</div>

      <div *ngIf="!loading" class="grid gap-4 sm:grid-cols-2">
        <div *ngFor="let s of slots" class="flex flex-col gap-2 p-4 rounded-lg border border-border bg-white">
          <span class="text-[14px] font-bold text-text-primary">{{ s.label }}</span>
          <p class="m-0 text-[12.5px] text-text-secondary">{{ s.hint }}</p>

          <div *ngIf="!s.image; else apercu"
               class="flex items-center justify-center min-h-[120px] p-4 rounded-lg border border-dashed border-border bg-field">
            <input type="file" accept="image/*" hidden #fileInput (change)="onFileSelected(s, $event)">
            <button type="button" class="btn btn-sm btn-outline" (click)="fileInput.click()">
              <mat-icon>upload</mat-icon> Importer une image
            </button>
          </div>

          <ng-template #apercu>
            <div class="relative flex items-center justify-center min-h-[120px] p-3 rounded-lg border border-border bg-white">
              <img [src]="s.image" [alt]="s.label" class="max-w-full max-h-[120px]">
              <button type="button" (click)="removeImage(s)" [attr.aria-label]="'Retirer ' + s.label"
                      class="absolute top-1.5 right-1.5 w-8 h-8 flex items-center justify-center rounded-full bg-black/55 text-white border-0 cursor-pointer">
                <mat-icon class="!text-base !w-4 !h-4">close</mat-icon>
              </button>
            </div>
          </ng-template>
        </div>
      </div>

      <div *ngIf="!loading" class="flex justify-end mt-5">
        <button type="button" class="btn btn-primary" [disabled]="saving" (click)="enregistrer()">
          <mat-icon>save</mat-icon> {{ saving ? 'Enregistrement…' : 'Enregistrer le paramétrage' }}
        </button>
      </div>
    </div>
  </div>
</div>
