    <div class="fade-in">
      <div class="page-head">
        <div>
          <h1>Espace Régional<ng-container *ngIf="regionName"> - {{ regionName }}</ng-container></h1>
          <p>Supervisez et validez les factures de votre région</p>
        </div>
      </div>

      <mat-tab-group animationDuration="0ms" [selectedIndex]="selectedTab" (selectedIndexChange)="onTabChange($event)">

        <!-- ===================== ONGLET 1 : TABLEAU DE BORD ===================== -->
        <mat-tab>
          <ng-template mat-tab-label>
            <mat-icon class="tab-ic">insights</mat-icon> Tableau de bord
          </ng-template>
          <ng-template matTabContent>
            <div class="pt-2 md:pt-6">
              <app-regional-factures></app-regional-factures>
            </div>
          </ng-template>
        </mat-tab>

        <!-- ===================== ONGLET 2 : FACTURES PHARMACIES ===================== -->
        <mat-tab>
          <ng-template mat-tab-label>
            <mat-icon class="tab-ic">local_pharmacy</mat-icon> Factures Pharmacies
            <span class="tab-count" *ngIf="counts['ENVOYEE']">{{ counts['ENVOYEE'] }}</span>
          </ng-template>
          <ng-template matTabContent>
            <div class="pt-2 md:pt-6">
              <div class="seg-toggle seg-toggle--wide">
                <button *ngFor="let g of statusGroups" type="button"
                        [class.active]="pharmaStatut === g.key"
                        (click)="selectPharmaStatut(g.key)">
                  {{ g.label }}
                  <span class="seg-count" [class.danger]="g.danger" *ngIf="badgeCount(g)">{{ badgeCount(g) }}</span>
                </button>
              </div>
              <app-factures-list displayMode="PHARMACIE" [monthlyView]="true"
                                 [allowedStatuses]="pharmaAllowed"
                                 [showToolbar]="false"></app-factures-list>
            </div>
          </ng-template>
        </mat-tab>

        <!-- ===================== ONGLET 3 : FACTURES STRUCTURES ===================== -->
        <mat-tab>
          <ng-template mat-tab-label>
            <mat-icon class="tab-ic">local_hospital</mat-icon> Factures Structures
          </ng-template>
          <ng-template matTabContent>
            <div class="pt-2 md:pt-6">
              <div class="seg-toggle seg-toggle--wide">
                <button *ngFor="let g of statusGroups" type="button"
                        [class.active]="structStatut === g.key"
                        (click)="selectStructStatut(g.key)">
                  {{ g.label }}
                  <span class="seg-count" [class.danger]="g.danger" *ngIf="badgeCount(g)">{{ badgeCount(g) }}</span>
                </button>
              </div>
              <app-factures-list displayMode="STRUCTURE" [monthlyView]="true"
                                 [allowedStatuses]="structAllowed"
                                 [showToolbar]="false"></app-factures-list>
            </div>
          </ng-template>
        </mat-tab>
      </mat-tab-group>
    </div>
