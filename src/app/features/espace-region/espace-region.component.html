<div class="fade-in max-w-7xl mx-auto px-3 sm:px-6 pt-2 pb-4 space-y-5 md:-mt-6">

  <!-- VUE CONTROLEUR SEUL (Pour l'agent au profil CONTROLEUR ou Admin en bascule) -->
  <div *ngIf="showControleurView">
    <app-espace-controleur></app-espace-controleur>
  </div>

  <!-- VUE ADMINISTRATEUR SR (7 Onglets de la spécification + Import historique) -->
  <div *ngIf="!showControleurView">
    <mat-tab-group animationDuration="0ms" [selectedIndex]="selectedTab" (selectedIndexChange)="onTabChange($event)" class="sr-tab-group">

      <!-- 1. TABLEAU DE BORD (Section 4.1) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">insights</mat-icon>
            <span class="font-medium text-xs md:text-sm">Tableau de bord</span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-regional-dashboard></app-regional-dashboard>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 2. SUIVI ENREGISTREMENT DES PRESTATAIRES (Section 4.2) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">app_registration</mat-icon>
            <span class="font-medium text-xs md:text-sm">Enregistrement prestataires</span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-suivi-enregistrement></app-suivi-enregistrement>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 3. FACTURES STRUCTURES SANITAIRES (Section 4.3) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">local_hospital</mat-icon>
            <span class="font-medium text-xs md:text-sm">Factures Structures</span>
            <span *ngIf="notifStructures > 0" class="ml-1.5 px-1.5 py-0.5 rounded-full text-[10px] font-semibold font-mono bg-amber-50 text-amber-700 border border-amber-200">
              {{ notifStructures }}
            </span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-factures-structures></app-factures-structures>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 4. FACTURES PHARMACIES (Section 4.4) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">local_pharmacy</mat-icon>
            <span class="font-medium text-xs md:text-sm">Factures Pharmacies</span>
            <span *ngIf="notifPharmacies > 0" class="ml-1.5 px-1.5 py-0.5 rounded-full text-[10px] font-semibold font-mono bg-amber-50 text-amber-700 border border-amber-200">
              {{ notifPharmacies }}
            </span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-factures-pharmacies></app-factures-pharmacies>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 5. SUIVI DU TRAITEMENT (Section 4.5) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">assignment_ind</mat-icon>
            <span class="font-medium text-xs md:text-sm">Suivi du traitement</span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-suivi-traitement></app-suivi-traitement>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 6. SUIVI BCSU (Section 4.6) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">account_balance</mat-icon>
            <span class="font-medium text-xs md:text-sm">Suivi BCSU</span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-suivi-bcsu></app-suivi-bcsu>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 7. PARAMÉTRAGE (Section 4.7) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">tune</mat-icon>
            <span class="font-medium text-xs md:text-sm">Paramétrage</span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-parametrage-sr></app-parametrage-sr>
          </div>
        </ng-template>
      </mat-tab>

      <!-- 8. IMPORT DES FACTURES (Archives / Reprise historique) -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5 py-1">
            <mat-icon class="!text-lg !w-[18px] !h-[18px]">upload_file</mat-icon>
            <span class="font-medium text-xs md:text-sm">Import historique</span>
          </div>
        </ng-template>
        <ng-template matTabContent>
          <div class="pt-2">
            <app-import-factures></app-import-factures>
          </div>
        </ng-template>
      </mat-tab>

    </mat-tab-group>
  </div>
</div>
