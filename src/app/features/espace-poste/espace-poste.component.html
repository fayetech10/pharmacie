<div class="fade-in">

  <!-- ═══════════ Accueil : trois choix ═══════════ -->
  <div *ngIf="selectedTab === 0" class="flex flex-col gap-5">
    <div class="page-head">
      <div>
        <h1>{{ structureNom }}</h1>
    </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <app-tuile-activite icone="verified_user" teinte="primary" titre="Facturation CSU"
                          (click)="changerOnglet(1)"></app-tuile-activite>
      <app-tuile-activite icone="point_of_sale" teinte="purple" titre="Facturation Hors CSU"
                          (click)="changerOnglet(3)"></app-tuile-activite>
      <app-tuile-activite icone="tune" teinte="slate" titre="Paramétrage"
                          (click)="changerOnglet(4)"></app-tuile-activite>
    </div>
  </div>

  <!-- ═══════════ Facturation CSU : deux onglets ═══════════ -->
  <ng-container *ngIf="selectedTab === 1 || selectedTab === 2">
    <!-- Mobile : barre d'onglets figée sous la topbar (54px + encoche), agrandie et pleine
         largeur ; « Accueil » masqué. Desktop (≥ md) : barre classique dans le flux. -->
    <div class="sticky top-[calc(54px_+_env(safe-area-inset-top))] z-30 -mx-3 mb-4 flex items-center gap-2 border-b border-border bg-bg px-3 py-2
                md:static md:top-auto md:z-auto md:mx-0 md:border-0 md:bg-transparent md:px-0 md:py-0 print:hidden">
      <button type="button" (click)="changerOnglet(0)" aria-label="Accueil du poste"
              class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-text-primary bg-field hover:bg-border-light rounded-lg border-0 cursor-pointer">
        <mat-icon class="!w-4 !h-4 !text-base">arrow_back</mat-icon> Accueil
      </button>
      <div class="onglets flex w-full p-1 rounded-lg bg-field md:w-auto md:ml-auto" role="tablist" aria-label="Facturation CSU">
        <button type="button" role="tab" [attr.aria-selected]="selectedTab === 1" (click)="changerOnglet(1)"
                class="inline-flex flex-1 items-center justify-center gap-2 px-4 py-2.5 text-[15px] rounded-md font-semibold border-0 cursor-pointer
                       md:flex-none md:gap-1.5 md:px-3.5 md:py-1.5 md:text-[13px]"
                [ngClass]="selectedTab === 1 ? 'bg-white text-primary shadow-sm' : 'bg-transparent text-text-secondary'">
          <mat-icon class="!w-5 !h-5 !text-xl md:!w-4 md:!h-4 md:!text-base">note_add</mat-icon> Facturation
        </button>
        <button type="button" role="tab" [attr.aria-selected]="selectedTab === 2" (click)="changerOnglet(2)"
                class="inline-flex flex-1 items-center justify-center gap-2 px-4 py-2.5 text-[15px] rounded-md font-semibold border-0 cursor-pointer
                       md:flex-none md:gap-1.5 md:px-3.5 md:py-1.5 md:text-[13px]"
                [ngClass]="selectedTab === 2 ? 'bg-white text-primary shadow-sm' : 'bg-transparent text-text-secondary'">
          <mat-icon class="!w-5 !h-5 !text-xl md:!w-4 md:!h-4 md:!text-base">receipt_long</mat-icon> Mes factures
        </button>
      </div>
    </div>

    <app-facturation-csu-poste *ngIf="selectedTab === 1"></app-facturation-csu-poste>
    <app-mes-factures-poste *ngIf="selectedTab === 2"></app-mes-factures-poste>
  </ng-container>

  <!-- ═══════════ Facturation Hors CSU ═══════════ -->
  <div *ngIf="selectedTab === 3" class="space-y-4">
    <button type="button" (click)="changerOnglet(0)"
            class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-text-primary bg-field hover:bg-border-light rounded-lg border-0 cursor-pointer print:hidden">
      <mat-icon class="!w-4 !h-4 !text-base">arrow_back</mat-icon> Accueil
    </button>
    <app-hors-csu></app-hors-csu>
  </div>

  <!-- ═══════════ Paramétrage ═══════════ -->
  <div *ngIf="selectedTab === 4" class="space-y-4">
    <button type="button" (click)="changerOnglet(0)"
            class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-text-primary bg-field hover:bg-border-light rounded-lg border-0 cursor-pointer print:hidden">
      <mat-icon class="!w-4 !h-4 !text-base">arrow_back</mat-icon> Accueil
    </button>
    <app-parametres-structure></app-parametres-structure>
  </div>
</div>
