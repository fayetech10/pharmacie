<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Couleur du chrome navigateur mobile, alignée sur la topbar sombre v3. -->
  <meta name="theme-color" content="#0E211B">
  <!-- Aperçu des liens partagés (WhatsApp, etc.) : un seul libellé, pas de sous-description. -->
  <title>Gestion des Factures SENCSU</title>
  <!-- Application installable (écran d'accueil) et utilisable hors ligne -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SENCSU">
  <!-- Polices (Inter, Caveat) et icônes Material : embarquées dans le build (angular.json,
       « styles »), plus chargées depuis Google Fonts — sans Internet, les icônes
       s'affichaient en toutes lettres (« edit », « delete »). -->
</head>
<body>
  <app-root></app-root>
  <!-- Badge « Powered by Netlify » (script /.netlify/scripts/hud injecté par Netlify) : il ne
       s'affiche pas si un élément #nl-badge-frame existe déjà. Réglage officiel : Netlify →
       Project configuration → General → Powered by Netlify badge. Ceci est le filet de sécurité. -->
  <div id="nl-badge-frame" hidden aria-hidden="true"></div>
  <style>iframe#nl-badge-frame { display: none !important; }</style>
</body>
</html>
