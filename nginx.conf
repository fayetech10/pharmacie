server {
  listen 80;

  # Pas de numéro de version nginx dans les en-têtes ni les pages d'erreur.
  server_tokens off;

  # Taille maximale d'une requête. Défaut nginx : 1 Mo — or une facture transporte ses
  # pièces justificatives (tickets, ordonnances) en base64 dans le JSON, et les imports
  # Excel passent aussi par ici : au-delà d'1 Mo, nginx répondait 413 avant même le
  # backend. Aligné sur les limites d'upload des applications (10 Mo), avec de la marge
  # pour l'encodage base64 (+33 %).
  client_max_body_size 20m;

  # Compression : le bundle Angular et les réponses JSON se compressent très bien.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/xml image/svg+xml;

  # En-têtes de sécurité. Déclarés ici et NULLE PART dans les « location » : nginx n'hérite
  # des add_header du niveau supérieur que si le bloc courant n'en déclare aucun.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /usr/share/nginx/html;

  # Application Angular : toute route inconnue retombe sur index.html, c'est le
  # routage cote client qui tranche.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html jamais en cache : c'est lui qui pointe vers les fichiers de la nouvelle
  # version. Mis en cache, un déploiement resterait invisible jusqu'au vidage du navigateur.
  location = /index.html {
    expires -1;
  }

  # Mode hors ligne (service worker Angular) : le script et son manifeste de version ne doivent
  # JAMAIS être gardés en cache — c'est en les relisant que l'application installée découvre
  # une nouvelle version. Gardés, un déploiement n'atteindrait plus les téléphones.
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
    expires -1;
    try_files $uri =404;
  }

  # Manifeste de l'application installable (nom, icônes) : type MIME attendu par les navigateurs.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    expires -1;
    try_files $uri =404;
  }

  # Fichiers empreintés par le build (main-K5RSRJBA.js, styles-IYYANX7C.css…) : leur nom
  # change à chaque version, ils peuvent donc être gardés un an. Les fichiers sans empreinte
  # (dossier assets) gardent le cache par défaut, faute de quoi une image modifiée
  # resterait périmée.
  location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$" {
    expires 1y;
    try_files $uri =404;
  }

  # Resolveur DNS interne de Docker. Indispensable avec la construction ci-dessous :
  # ecrit en dur (proxy_pass http://api-gateway:8080), nginx resout le nom UNE SEULE
  # FOIS au demarrage et garde l'adresse. Recreer le conteneur de la passerelle — ce
  # que fait n'importe quel « docker compose up -d » apres un changement — lui donne
  # une nouvelle IP, et le tableau de bord repond 502 jusqu'au redemarrage de nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # L'API passe par la passerelle, jamais par un service en direct : c'est elle
  # qui aiguille selon le chemin et le role porte par le jeton.
  # « ^~ » : aucune location par expression reguliere (cache des fichiers empreintes)
  # n'est evaluee pour /api — un export au nom de fichier en .css/.js resterait a l'API.
  location ^~ /api {
    # Passer par une variable force la resolution a chaque requete. En contrepartie
    # nginx cesse de transmettre l'URI d'origine : $request_uri la retablit, chemin
    # et parametres compris.
    set $passerelle http://api-gateway:8080;
    proxy_pass $passerelle$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Exports PDF/Excel : laisser le temps a la generation, et ne pas tamponner
    # un fichier de plusieurs Mo en memoire avant de le transmettre.
    proxy_read_timeout 300s;
    proxy_buffering off;
  }
}
